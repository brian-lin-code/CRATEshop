name: CRATEShop
version: 1.0.0
main: me.cratesmp.crateshop.CRATEShop
api-version: '1.21'
author: CRATE SMP
description: GUI economy shop for CRATE SMP.
softdepend: [Vault]
commands:
  shop:
    description: Opens the CRATE SMP shop.
    usage: /shop
    aliases: [crateshop]
permissions:
  crateshop.use:
    description: Allows the player to use /shop.
    default: true
  crateshop.reload:
    description: Allows reloading CRATEShop.
    default: op
